name: Validate skill

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate_public_package.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/render_docx.py --input templates/article.example.json --output dist/example.docx
      - run: python scripts/validate_article.py --input templates/article.example.json --docx dist/example.docx
      - run: npx -y skills@latest add . --list
