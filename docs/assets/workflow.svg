<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 190" role="img" aria-labelledby="title desc">
  <title id="title">Seven-step public writing workflow</title>
  <desc id="desc">Frame, read, verify, structure, draft, deliver, and audit connected from left to right.</desc>
  <rect width="1120" height="190" fill="#ffffff"/>
  <path d="M110 95H1010" stroke="#9eb3ac" stroke-width="4"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(90 95)"><circle r="31" fill="#0f766e"/><text y="6" fill="white" font-size="20" font-weight="700">1</text><text y="57" fill="#172321" font-size="14">Frame</text></g>
    <g transform="translate(245 95)"><circle r="31" fill="#315f8a"/><text y="6" fill="white" font-size="20" font-weight="700">2</text><text y="57" fill="#172321" font-size="14">Read</text></g>
    <g transform="translate(400 95)"><circle r="31" fill="#b7791f"/><text y="6" fill="white" font-size="20" font-weight="700">3</text><text y="57" fill="#172321" font-size="14">Verify</text></g>
    <g transform="translate(555 95)"><circle r="31" fill="#c85d4a"/><text y="6" fill="white" font-size="20" font-weight="700">4</text><text y="57" fill="#172321" font-size="14">Structure</text></g>
    <g transform="translate(710 95)"><circle r="31" fill="#0f766e"/><text y="6" fill="white" font-size="20" font-weight="700">5</text><text y="57" fill="#172321" font-size="14">Draft</text></g>
    <g transform="translate(865 95)"><circle r="31" fill="#315f8a"/><text y="6" fill="white" font-size="20" font-weight="700">6</text><text y="57" fill="#172321" font-size="14">Deliver</text></g>
    <g transform="translate(1020 95)"><circle r="31" fill="#c85d4a"/><text y="6" fill="white" font-size="20" font-weight="700">7</text><text y="57" fill="#172321" font-size="14">Audit</text></g>
  </g>
</svg>
