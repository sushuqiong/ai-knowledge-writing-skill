<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">AI Knowledge Writing Skill</title>
  <desc id="desc">Seven verified writing stages connected across a clean documentation cover.</desc>
  <rect width="1400" height="520" fill="#f4f7f5"/>
  <rect x="72" y="62" width="1256" height="396" rx="8" fill="#ffffff" stroke="#ccd7d2" stroke-width="2"/>
  <text x="120" y="145" fill="#0f766e" font-family="Arial, sans-serif" font-size="24" font-weight="700">SOURCE-AWARE · ORIGINAL · PRIVACY-SAFE</text>
  <text x="120" y="220" fill="#172321" font-family="Arial, sans-serif" font-size="58" font-weight="800">AI Knowledge Writing</text>
  <text x="120" y="272" fill="#5f6d69" font-family="Arial, sans-serif" font-size="25">From source reading to verified DOCX delivery</text>
  <path d="M150 350H1250" stroke="#9eb3ac" stroke-width="4"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(150 350)"><circle r="27" fill="#0f766e"/><text y="6" fill="white" font-size="18" font-weight="700">1</text><text y="54" fill="#172321" font-size="15">Frame</text></g>
    <g transform="translate(333 350)"><circle r="27" fill="#315f8a"/><text y="6" fill="white" font-size="18" font-weight="700">2</text><text y="54" fill="#172321" font-size="15">Read</text></g>
    <g transform="translate(516 350)"><circle r="27" fill="#b7791f"/><text y="6" fill="white" font-size="18" font-weight="700">3</text><text y="54" fill="#172321" font-size="15">Verify</text></g>
    <g transform="translate(699 350)"><circle r="27" fill="#c85d4a"/><text y="6" fill="white" font-size="18" font-weight="700">4</text><text y="54" fill="#172321" font-size="15">Structure</text></g>
    <g transform="translate(882 350)"><circle r="27" fill="#0f766e"/><text y="6" fill="white" font-size="18" font-weight="700">5</text><text y="54" fill="#172321" font-size="15">Draft</text></g>
    <g transform="translate(1065 350)"><circle r="27" fill="#315f8a"/><text y="6" fill="white" font-size="18" font-weight="700">6</text><text y="54" fill="#172321" font-size="15">Deliver</text></g>
    <g transform="translate(1250 350)"><circle r="27" fill="#c85d4a"/><text y="6" fill="white" font-size="18" font-weight="700">7</text><text y="54" fill="#172321" font-size="15">Audit</text></g>
  </g>
</svg>
